# yaml-language-server: $schema=https://docs.obsei.com/schema/obsei.schema.json
# obsei configuration. Docs: https://docs.obsei.com/configuration/
# Secrets never go in this file: set the environment variables named by *_env fields.
#   OBSEI_DB_KEY          encrypts the local database (16+ characters)
#   OBSEI_PSEUDONYM_SALT  pseudonymises author handles (16+ characters); unset = authors dropped
# 'obsei init' generates both in .obsei/secrets.env; variables set in the environment win.
# Add a source or sink without editing this file: obsei add appstore, obsei add slack (all of
# them: obsei integrations); then obsei check.
version: 1

store:
  path: obsei_pizza_demo_50_tuned.duckdb

privacy:
  redact: true
  # PII detectors to apply: global, north_america, uk, eu, latam, apac, india, africa
  regions: [global, north_america, uk, eu, latam, apac, india, africa]

# Models. The default classifier runs in process, so nothing leaves the machine:
#   pip install 'obsei[local]' && obsei models download
llms:
  default:
    api: local
    model: MoritzLaurer/bge-m3-zeroshot-v2.0
    # models: {sentiment: fastino/gliner2-multi-v1}   # optional per-question model
  # A decision model served by llama.cpp (e.g. Julia-1):
  # default:
  #   api: decision
  #   url_env: OBSEI_DECISION_URL
  # A chat model (needed for ask, theme labels and free-text fields), e.g. Ollama:
  # chat:
  #   base_url: http://localhost:11434/v1
  #   model: qwen3:8b
  # A cloud chat model needs its own llms entry and must pass the egress policy (private mode with
  # its host allow-listed); use one only with consent to send feedback to that provider.
  # See https://docs.obsei.com/guides/models/
# ask_llm: chat

themes:
  embedder: auto
  similarity: 0.50
  duplicate_similarity: 0.9
  k_anonymity: 2




pipelines:
  - name: feedback
    batch_size: 10

    sources:
      - key: pizza_feedback
        type: csv
        config:
          path: obsei_pizza_demo_50.csv
          fields:
            text: text
            id: id
            lang: language
            created_at: date

    enrichers:
      - type: classify
        config:
          llm: default
          threshold: 0.4
          intents:
            booking: "Đặt bàn, thay đổi, hủy hoặc tra cứu thông tin đặt bàn"
            chatbot_support: "Vấn đề hoặc yêu cầu hỗ trợ liên quan đến chatbot"
            staff_service: "Phản hồi về nhân viên và chất lượng phục vụ"
            food_menu: "Món ăn, menu, nguyên liệu và dị ứng thực phẩm"
            branch_experience: "Chi nhánh, địa chỉ, không gian và tiện ích"
            takeaway_delivery: "Đơn mang về, giao hàng và trạng thái nhận món"
            other: "Nội dung không thuộc các nhóm nghiệp vụ trên"

    sinks:
      - type: parquet
        config:
          directory: exports_demo_50_tuned
